name: Deploy Landing Page

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "docs/install.sh"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Serve the installer alongside the landing page so the documented
      # `curl -fsSL https://jlkendrick.github.io/sprite/docs/install.sh | bash`
      # resolves. Only landing/ is uploaded, so docs/ has to be staged into it.
      - name: Stage install script
        run: |
          mkdir -p landing/docs
          cp docs/install.sh landing/docs/install.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing/

      - id: deploy
        uses: actions/deploy-pages@v4
