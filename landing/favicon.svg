<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <defs>
    <linearGradient id="brand-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <!-- Matches landing/styles.css defaults for data-accent="moss" -->
      <stop offset="0%" stop-color="oklch(0.58 0.14 165)" />
      <stop offset="100%" stop-color="oklch(0.55 0.14 220)" />
    </linearGradient>
  </defs>

  <!-- Rounded gradient square -->
  <rect x="0" y="0" width="36" height="36" rx="10" fill="url(#brand-bg)" />
  <!-- Inset highlight border -->
  <rect x="1" y="1" width="34" height="34" rx="9" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <!-- Sprite mark (same paths as landing/app.jsx BrandMark): a four-point
       sparkle star with a curling motion trail and a tiny trailing spark.
       Source viewBox is 0 0 40 40; we scale by 0.9 (36/40) to fit. -->
  <g transform="scale(0.9)" fill="none" stroke="#fff"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- curling motion trail -->
    <path d="M7 30 Q 11 22 16 22 T 24 16"
          stroke-width="1.4" opacity="0.55"
          stroke-dasharray="1 3" />
    <!-- four-point sparkle star — the sprite itself -->
    <g transform="translate(25 16)">
      <path d="M0 -8 L1.6 -1.6 L8 0 L1.6 1.6 L0 8 L-1.6 1.6 L-8 0 L-1.6 -1.6 Z"
            fill="#fff" stroke="none" />
      <circle cx="0" cy="0" r="1.6" fill="#fff" stroke="none" opacity="0.6" />
    </g>
    <!-- trailing tiny spark -->
    <g transform="translate(13 26)">
      <path d="M0 -2.6 L0.6 -0.6 L2.6 0 L0.6 0.6 L0 2.6 L-0.6 0.6 L-2.6 0 L-0.6 -0.6 Z"
            fill="#fff" stroke="none" opacity="0.75" />
    </g>
  </g>
</svg>
